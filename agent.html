    <style>
        :root {
          --a-brand:#0056b3; --a-brand-hover:#004494; --a-primary-button-bg:#0056b3; --a-primary-button-text:#ffffff; --a-sidebar:#1a1a1a; --a-sidebar-text:#ffffff;
          --a-page:#f5f5f7; --a-panel:#ffffff; --a-text:#333333; --a-muted:#6a6a6a; --a-border:#e0e0e0;
          --a-subtle-surface:#f0f0f0; --a-subtle-text:#555555; --a-input-bg:#ffffff; --a-input-text:#333333;
          --a-input-border:#cccccc; --a-input-focus:#0056b3; --a-secondary:#e0e0e0; --a-secondary-text:#333333;
          --a-outline-border:#0056b3; --a-script-bg:#f4f8fc; --a-script-border:#0056b3; --a-badge-bg:#e0e0e0;
          --a-badge-text:#555555; --a-success:#2e7d32; --a-success-text:#ffffff; --a-danger:#c62828;
          --a-danger-text:#ffffff; --a-warning-bg:#fff3cd; --a-warning-text:#856404; --a-warning-border:#ffebaa;
          --a-danger-bg:#f8d7da; --a-danger-border:#f5c6cb; --a-info-bg:#d1ecf1; --a-info-text:#0c5460;
          --a-info-border:#bee5eb; --a-success-bg:#d4edda; --a-success-border:#c3e6cb;
          --a-overlay:#000000; --a-shadow:#0056b3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--a-page); color: var(--a-text); display: flex; height: 100vh; overflow: hidden; }
        #app-container { display: flex; width: 100%; height: 100%; }

        #sidebar { width: 320px; background-color: var(--a-sidebar); color: var(--a-sidebar-text); padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; border-right: 4px solid var(--a-brand); }
        #sidebar h2 { font-size: 0.9rem; color: var(--a-brand); margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }

        #panic-search { width: 100%; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--a-input-border); background: var(--a-input-bg); color: var(--a-input-text); margin-bottom: 5px; }
        #panic-search::placeholder { color: var(--a-muted); }

        .sidebar-item-list { display: flex; flex-direction: column; gap: 10px; }
        .objection-btn { background: color-mix(in srgb, var(--a-sidebar-text) 8%, var(--a-sidebar)); color: var(--a-sidebar-text); border: 1px solid var(--a-border); padding: 10px 12px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 0.9rem; transition: all 0.2s ease; }
        .objection-btn:hover { background: var(--a-primary-button-bg); color: var(--a-primary-button-text); border-color: var(--a-primary-button-bg); }

        #sidebar-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--a-border); display: flex; flex-direction: column; gap: 10px; }
        .hotfix-btn { background: transparent; color: var(--a-muted); border: 1px solid var(--a-border); padding: 8px 10px; font-size: 0.75rem; cursor: pointer; border-radius: 4px; width: 100%; }
        .hotfix-btn:hover { background: var(--a-subtle-surface); color: var(--a-text); }

        .floating-reset { position: fixed; bottom: 30px; right: 30px; background: var(--a-primary-button-bg); color: var(--a-primary-button-text); border: none; padding: 15px 25px; border-radius: 30px; box-shadow: 0 4px 15px color-mix(in srgb, var(--a-shadow) 40%, transparent); cursor: pointer; font-weight: bold; z-index: 999; }
        .floating-reset:hover { filter: brightness(0.9); }

        #main-content { flex: 1; display: flex; flex-direction: column; height: 100%; background-color: var(--a-page); }
        header { background-color: var(--a-panel); padding: 15px 30px; border-bottom: 1px solid var(--a-border); }
        .header-brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .logo-text { font-size: 1.2rem; font-weight: 800; color: var(--a-brand); }
        .theme-toggle { background: var(--a-panel); color: var(--a-text); border: 1px solid var(--a-border); border-radius: 4px; padding: 8px 12px; cursor: pointer; }
        .theme-toggle:hover { border-color: var(--a-brand); }

        .flow-container { flex: 1; padding: 20px 40px 100px 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 25px; align-items: center; }
        .phase-card { background-color: var(--a-panel); border-radius: 8px; box-shadow: 0 4px 15px color-mix(in srgb, var(--a-shadow) 6%, transparent); width: 100%; max-width: 800px; padding: 30px; border-left: 4px solid var(--a-border); transition: border-color 0.3s ease; }
        .phase-card.active-focus { border-left-color: var(--a-brand); box-shadow: 0 4px 25px color-mix(in srgb, var(--a-shadow) 18%, transparent); }

        h1 { font-size: 1.4rem; margin-bottom: 15px; color: var(--a-text); display: flex; justify-content: space-between; align-items: center; }
        .step-badge { font-size: 0.8rem; background: var(--a-badge-bg); padding: 4px 10px; border-radius: 12px; color: var(--a-badge-text); }
        .script-box { background-color: var(--a-script-bg); border-left: 4px solid var(--a-script-border); padding: 15px 20px; border-radius: 0 8px 8px 0; margin-bottom: 20px; font-size: 1.05rem; line-height: 1.6; }
        .notes-box { font-size: 0.85rem; color: var(--a-muted); margin-top: 15px; padding: 10px; background: var(--a-subtle-surface); border-radius: 4px; }
        .markdown-content > :first-child { margin-top: 0; }
        .markdown-content > :last-child { margin-bottom: 0; }
        .markdown-content p { margin: 0 0 1.6em; }
        .markdown-content ul, .markdown-content ol { padding-left: 1.6em; }
        .markdown-content table { border-collapse: collapse; margin: 0.8em 0; }
        .markdown-content th, .markdown-content td { border: 1px solid var(--a-border); padding: 6px 9px; text-align: left; }
        .markdown-content th { background: var(--a-subtle-surface); }
        .markdown-content pre { overflow-x: auto; padding: 10px; background: var(--a-subtle-surface); border-radius: 4px; }
        .markdown-content code { padding: 0.1em 0.3em; background: var(--a-subtle-surface); border-radius: 3px; }
        .markdown-content pre code { padding: 0; background: transparent; }
        .markdown-content blockquote { margin-left: 0; padding-left: 1em; border-left: 3px solid var(--a-border); color: var(--a-muted); }
        .markdown-content a { color: var(--a-brand); }

        .alert-banner { padding: 12px 15px; border-radius: 6px; margin-bottom: 20px; font-size: 0.95rem; border: 1px solid transparent; }
        .alert-banner.warning { background-color: var(--a-warning-bg); border-color: var(--a-warning-border); color: var(--a-warning-text); }
        .alert-banner.stop { background-color: var(--a-danger-bg); border-color: var(--a-danger-border); color: var(--a-danger-text); }
        .alert-banner.info { background-color: var(--a-info-bg); border-color: var(--a-info-border); color: var(--a-info-text); }
        .alert-banner.success { background-color: var(--a-success-bg); border-color: var(--a-success-border); color: var(--a-success-text); }

        .btn-container { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background-color: var(--a-primary-button-bg); color: var(--a-primary-button-text); }
        .btn-secondary { background-color: var(--a-secondary); color: var(--a-secondary-text); }
        .btn-success { background-color: var(--a-success); color: var(--a-success-text); }
        .btn-danger { background-color: var(--a-danger); color: var(--a-danger-text); }
        .btn-warning { background-color: var(--a-warning-bg); color: var(--a-warning-text); border: 1px solid var(--a-warning-border); }
        .btn-outline { background: transparent; color: var(--a-brand); border: 1px solid var(--a-outline-border); }
        .btn-muted { opacity: 0.4; filter: grayscale(50%); }
        .btn-selected { box-shadow: 0 0 0 3px color-mix(in srgb, var(--a-shadow) 20%, transparent); transform: scale(0.98); }

        .config-import-label { display: block; text-align: center; }
        .config-import-input { display: none; }
        .sidebar-divider { border-color: var(--a-border); }
        .version-meta { font-size: 0.7rem; color: var(--a-muted); }
        .modal-title { color: var(--a-brand); margin-bottom: 15px; }
        .reference-content { overflow-x: auto; }
        button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--a-input-focus); outline-offset: 2px; }

        @media (max-width: 760px) {
          body { height: 100dvh; }
          #app-container { flex-direction: column; min-height: 0; }
          #sidebar { width: 100%; max-height: 42dvh; padding: 12px 14px; border-right: 0; border-bottom: 3px solid var(--a-brand); }
          #sidebar-footer { margin-top: 8px; padding-top: 10px; }
          #main-content { min-height: 0; }
          header { padding: 12px 16px; }
          .flow-container { padding: 16px 14px 90px; gap: 16px; }
          .phase-card { padding: 18px; }
          .floating-reset { right: 14px; bottom: 14px; padding: 11px 16px; }
        }

        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: color-mix(in srgb, var(--a-overlay) 60%, transparent); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--a-panel); padding: 25px; border-radius: 8px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; color: var(--a-text); }
        .modal-wide { max-width: 900px; }
        textarea { width: 100%; height: 100px; margin-top: 10px; font-family: monospace; padding: 10px; border: 1px solid var(--a-input-border); background: var(--a-input-bg); color: var(--a-input-text); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.8rem; }
        th, td { border: 1px solid var(--a-border); padding: 8px; text-align: left; }
    </style>
    <script>
    (function() {
        // The keycodes for: Up, Up, Down, Down, Left, Right, Left, Right, B, A
        const konamiCode = [38, 38, 40, 40, 37, 39, 37, 39, 66, 65];
        let currentIndex = 0;

        document.addEventListener('keydown', (event) => {
            // Check if the pressed key matches the current key in the sequence
            if (event.keyCode === konamiCode[currentIndex]) {
                currentIndex++;

                // If the whole sequence was entered correctly
                if (currentIndex === konamiCode.length) {
                    alert('Konami Code Activated! Only Kind Customers');

                    // Spin the entire webpage around
                    document.body.style.transition = 'transform 1s';
                    document.body.style.transform = 'rotate(368deg)';

                    // Reset the rotation after 1 second
                    setTimeout(() => {
                        document.body.style.transform = 'rotate(0deg)';
                    }, 1000);

                    // Reset the sequence tracker
                    currentIndex = 0;
                }
            } else {
                // Reset the sequence tracker if the wrong key is pressed
                currentIndex = 0;
            }
        });
    })();
    </script>
</head>

          function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[character]);
          }

          function safeMarkdownUrl(value) {
            try {
              const url = new URL(value, document.baseURI);
              return ['http:', 'https:', 'mailto:', 'tel:'].includes(url.protocol) || (!/^[a-z][a-z\d+.-]*:/i.test(value) && url.protocol === window.location.protocol);
            } catch (error) {
              return false;
            }
          }

          function renderMarkdownInline(value) {
            const preserved = [];
            const preserve = html => `\uE000${preserved.push(html) - 1}\uE001`;
            let source = String(value);
            source = source.replace(/`([^`\n]+)`/g, (match, code) => preserve(`<code>${escapeHtml(code)}</code>`));
            source = source.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, (match, label, href, title) => {
              if (!safeMarkdownUrl(href)) return match;
              const titleAttribute = title ? ` title="${escapeHtml(title)}"` : '';
              return preserve(`<a href="${escapeHtml(href)}"${titleAttribute}>${escapeHtml(label)}</a>`);
            });
            source = escapeHtml(source)
              .replace(/\*\*\*(?=\S)(.+?\S)\*\*\*/g, '<strong><em>$1</em></strong>')
              .replace(/___(?=\S)(.+?\S)___/g, '<strong><em>$1</em></strong>')
              .replace(/(\*\*|__)(?=\S)(.+?\S)\1/g, '<strong>$2</strong>')
              .replace(/~~(?=\S)(.+?\S)~~/g, '<del>$1</del>')
              .replace(/\+\+(?=\S)(.+?\S)\+\+/g, '<u>$1</u>')
              .replace(/(^|[^\*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
              .replace(/(^|[^\w])_([^_\s][^_\n]*?)_(?![\w])/g, '$1<em>$2</em>')
              .replace(/\n/g, '<br>');
            return source.replace(/\uE000(\d+)\uE001/g, (match, index) => preserved[Number(index)]);
          }

          function renderMarkdown(value) {
            const lines = String(value || '').replace(/\r\n?/g, '\n').split('\n');
            const output = [];
            const isList = line => /^\s*([-+*]|\d+[.)])\s+/.test(line);
            const cells = line => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
            const isTable = index => {
              if (index + 1 >= lines.length || !lines[index].includes('|')) return false;
              const headers = cells(lines[index]);
              const separators = cells(lines[index + 1]);
              return headers.length === separators.length && separators.every(cell => /^:?-{3,}:?$/.test(cell));
            };
            const isBlockStart = index => {
              const line = lines[index];
              return /^ {0,3}(#{1,6})\s+/.test(line) || /^ {0,3}(```+|~~~+)/.test(line) ||
                /^ {0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line) || /^ {0,3}>/.test(line) ||
                isList(line) || isTable(index);
            };
            const renderList = start => {
              const first = lines[start].match(/^(\s*)([-+*]|\d+[.)])\s+(.*)$/);
              const indent = first[1].length;
              const ordered = /^\d/.test(first[2]);
              const tag = ordered ? 'ol' : 'ul';
              const items = [];
              let index = start;
              while (index < lines.length) {
                const item = lines[index].match(/^(\s*)([-+*]|\d+[.)])\s+(.*)$/);
                if (item && item[1].length === indent && /^\d/.test(item[2]) === ordered) {
                  items.push({ text: item[3], nested: [] });
                  index++;
                } else if (item && item[1].length > indent && items.length) {
                  const nested = renderList(index);
                  items[items.length - 1].nested.push(nested.html);
                  index = nested.end;
                } else if (items.length && lines[index].trim() && /^\s+/.test(lines[index])) {
                  items[items.length - 1].text += `\n${lines[index].trim()}`;
                  index++;
                } else break;
              }
              return {
                html: `<${tag}>${items.map(item => `<li>${renderMarkdownInline(item.text)}${item.nested.join('')}</li>`).join('')}</${tag}>`,
                end: index
              };
            };

            for (let index = 0; index < lines.length;) {
              const line = lines[index];
              if (!line.trim()) { index++; continue; }

              const fence = line.match(/^ {0,3}(```+|~~~+)/);
              if (fence) {
                const code = [];
                index++;
                while (index < lines.length && !new RegExp(`^ {0,3}${fence[1][0]}{${fence[1].length},}\\s*$`).test(lines[index])) code.push(lines[index++]);
                if (index < lines.length) index++;
                output.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);
                continue;
              }

              const heading = line.match(/^ {0,3}(#{1,6})\s+(.*?)(?:\s+#+\s*)?$/);
              if (heading) {
                const level = heading[1].length;
                output.push(`<h${level}>${renderMarkdownInline(heading[2])}</h${level}>`);
                index++;
                continue;
              }
              if (/^ {0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
                output.push('<hr>');
                index++;
                continue;
              }
              if (isTable(index)) {
                const headers = cells(line);
                const alignments = cells(lines[index + 1]).map(cell => cell.startsWith(':') && cell.endsWith(':') ? 'center' : cell.endsWith(':') ? 'right' : cell.startsWith(':') ? 'left' : '');
                index += 2;
                const rows = [];
                while (index < lines.length && lines[index].includes('|') && lines[index].trim()) rows.push(cells(lines[index++]));
                output.push(`<table><thead><tr>${headers.map((cell, cellIndex) => `<th${alignments[cellIndex] ? ` style="text-align:${alignments[cellIndex]}"` : ''}>${renderMarkdownInline(cell)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${headers.map((header, cellIndex) => `<td${alignments[cellIndex] ? ` style="text-align:${alignments[cellIndex]}"` : ''}>${renderMarkdownInline(row[cellIndex] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
                continue;
              }
              if (/^ {0,3}>/.test(line)) {
                const quote = [];
                while (index < lines.length && /^ {0,3}>/.test(lines[index])) quote.push(lines[index++].replace(/^ {0,3}> ?/, ''));
                output.push(`<blockquote>${renderMarkdown(quote.join('\n'))}</blockquote>`);
                continue;
              }
              if (isList(line)) {
                const list = renderList(index);
                output.push(list.html);
                index = list.end;
                continue;
              }

              const paragraph = [line];
              index++;
              while (index < lines.length && lines[index].trim() && !isBlockStart(index)) paragraph.push(lines[index++]);
              output.push(`<p>${renderMarkdownInline(paragraph.join('\n'))}</p>`);
            }
            return output.join('');
          }

          function appendMarkdownContent(target, value) {
            target.classList.add('markdown-content');
            target.innerHTML = renderMarkdown(value);

        function initFlow() {

        function renderNode(nodeId) {

              button.textContent = buttonConfig.label;
              button.addEventListener('click', () => handleChoice(button, node.id, buttonConfig.target, buttonConfig.label));

            document.getElementById('flow-scroll-wrapper').appendChild(card);

        function handleChoice(btnEl, currentId, targetId, label) {
            if (targetId === 'reset') { resetCall(); return; }

            const pathIndex = currentPath.findIndex(p => p.id === currentId);
            if (pathIndex !== -1 && pathIndex < currentPath.length - 1) {
                currentPath = currentPath.slice(0, pathIndex + 1);
            }

            const now = new Date().toLocaleTimeString();

            currentPath[currentPath.length - 1].label = label;
            currentPath[currentPath.length - 1].timestamp = now;
            currentPath.push({ id: targetId, title: flowMap[targetId].title, label: '...' });

            const card = document.getElementById(`card-${currentId}`);

            card.querySelectorAll('.btn').forEach(b => {
                b.classList.remove('btn-selected');
                b.classList.add('btn-muted');
            });
            btnEl.classList.remove('btn-muted');
            btnEl.classList.add('btn-selected');
            card.classList.remove('active-focus');

            let sibling = card.nextElementSibling;
            while(sibling) {
                const next = sibling.nextElementSibling;
                sibling.remove();
                sibling = next;
            }

            renderNode(targetId);
        }

        function showHistory(page = 0) {
            historyPage = page;
            const history = getCallHistory();
            const perPage = 10;
            const start = historyPage * perPage;
            const end = start + perPage;
            const slice = history.slice(start, end);
            const totalPages = Math.ceil(history.length / perPage);

            let html = history.length === 0 ? '<p>No history found.</p>' :
                `<table><thead><tr><th>Time Ended</th><th>Path Taken</th><th>Action</th></tr></thead><tbody>` +
                slice.map((h, i) => `<tr>
                    <td>${escapeHtml(h.timestamp)}</td>
                    <td>${h.path.map(step => `<strong>${escapeHtml(step.title)}</strong>: ${escapeHtml(step.label)} ${step.timestamp ? `(${escapeHtml(step.timestamp)})` : ''}`).join(' <br>➔ ')}</td>
                    <td><button class="btn btn-danger" style="padding: 5px 10px;" onclick="deleteHistoryItem(${start + i})">Delete</button></td>
                </tr>`).join('') + `</tbody></table>`;

            html += `
            <div style="margin-top:20px; display:flex; justify-content: space-between; align-items:center;">
                <div>
                    <button class="btn btn-secondary" onclick="showHistory(${historyPage - 1})" ${historyPage === 0 ? 'disabled' : ''}>Prev</button>
                    <span style="margin: 0 10px;">Page ${historyPage + 1} of ${totalPages || 1}</span>
                    <button class="btn btn-secondary" onclick="showHistory(${historyPage + 1})" ${end >= history.length ? 'disabled' : ''}>Next</button>
                </div>
                <div style="display:flex; gap: 10px;">
                    <button class="btn btn-danger" onclick="clearHistory()">Clear All Logs</button>
                    <button class="btn btn-primary" onclick="exportHistory()">Export JSON</button>
                    <label class="btn btn-secondary" style="cursor: pointer; margin:0;">
                        Import JSON <input type="file" style="display:none;" onchange="importHistory(event)">
                    </label>
                </div>
            </div>`;

            renderModal("Call History", html, true);
        }

        function exportHistory() {
            const data = JSON.stringify(getCallHistory(), null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `OpenCallFlow_History_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importHistory(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!Array.isArray(imported) || !imported.every(item => item && typeof item.timestamp === 'string' && Array.isArray(item.path) && item.path.every(step => step && typeof step.title === 'string' && typeof step.label === 'string'))) throw new Error('Invalid history records.');

                    let existing = getCallHistory();

                    // Merge logic: Add only if the timestamp and path string aren't identical
                    imported.forEach(item => {
                        const isDuplicate = existing.some(ex =>
                            ex.timestamp === item.timestamp &&
                            JSON.stringify(ex.path) === JSON.stringify(item.path)
                        );
                        if (!isDuplicate) existing.unshift(item);
                    });

                    if (!storageSet('callHistory', JSON.stringify(existing))) throw new Error('Browser storage is unavailable.');
                    alert("History merged successfully!");
                    showHistory(0);
                } catch(err) {
                    alert("Invalid History JSON!");
                }
            };
            reader.readAsText(file);
        }

        function deleteHistoryItem(index) {
            if (confirm("Are you sure you want to delete this specific call record?")) {
                let history = getCallHistory();
                history.splice(index, 1);
                storageSet('callHistory', JSON.stringify(history));
                showHistory(historyPage);
            }
        }

        function clearHistory() {
            if (confirm("TRIPLE CONFIRMATION: Are you ABSOLUTELY sure you want to clear ALL call history? This cannot be undone.")) {
                if (confirm("Are you really, really sure?")) {
                    if (confirm("Final confirmation: Delete all logs?")) {
                        storageRemove('callHistory');
                        showHistory(0);
                    }
                }
            }
        }

        function openHotfixModal() {
          renderModal('System Hotfix', `<textarea id="hotfix-input">${escapeHtml(JSON.stringify(appConfig, null, 2))}</textarea><div style="margin-top:15px; display:flex; gap:10px;"><button class="btn btn-primary" onclick="applyHotfix()">Apply</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>`);
        }

        function installConfig(config) {
          validateConfig(config);
          appConfig = config;
          storageSet('appConfig', JSON.stringify(appConfig));
          const preference = storageGet('themeMode');
          applyTheme(['light', 'dark'].includes(preference) ? preference : appConfig.theme.defaultMode);
          initSidebar();
          initFlow();
          closeModal();
        }

        function applyHotfix() {
          try {
            installConfig(JSON.parse(document.getElementById('hotfix-input').value));
          } catch (error) {
            alert('Invalid configuration: ' + error.message);
          }
        }

        function exportConfig() {
          const blob = new Blob([JSON.stringify(appConfig, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `OpenCallFlow_Config_${new Date().toISOString().split('T')[0]}.json`;
          link.click();
          URL.revokeObjectURL(url);
        }

        function importConfigFile(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try { installConfig(JSON.parse(reader.result)); }
            catch (error) { alert('Invalid configuration: ' + error.message); }
            event.target.value = '';
          };
          reader.readAsText(file);
        }

        document.addEventListener('keydown', event => {
          const overlay = document.getElementById('modal-overlay');
          if (overlay.style.display !== 'flex') return;
          if (event.key === 'Escape') {
            closeModal();
            return;
          }
          if (event.key !== 'Tab') return;
          const modal = overlay.querySelector('.modal-content');
          const focusable = [...modal.querySelectorAll('button:not([disabled]), a[href], input:not([disabled]), textarea:not([disabled]), select:not([disabled])')]
            .filter(element => element.getClientRects().length > 0);
          if (!focusable.length) {
            event.preventDefault();
            modal.focus();
            return;
          }
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && (document.activeElement === first || document.activeElement === modal)) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        });

        window.onload = () => {
          const savedConfig = storageGet('appConfig');
            if (savedConfig) {
                try {
              const parsed = JSON.parse(savedConfig);
              validateConfig(parsed);
              appConfig = parsed;
            } catch (error) {
              console.error('Saved configuration is invalid; using the embedded default.', error);
                }
            }
          const preference = storageGet('themeMode');
          validateConfig(appConfig);
          applyTheme(['light', 'dark'].includes(preference) ? preference : appConfig.theme.defaultMode);
          initSidebar();
          initFlow();
        };
    </script>
</body>
</html>
